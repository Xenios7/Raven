# the headless service. This gives each pod a stable DNS name
# so they can find each other.
apiVersion: v1
kind: Service
metadata:
  name: raven
spec:
  clusterIP: None
  selector:
    app: raven
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
    - name: http
      port: 8080
      targetPort: 8080















